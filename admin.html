<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>编目协作审核</title>
<style>
body{margin:0}[hidden]{display:none!important}

/* Layout: field-notebook page — a narrow reading column with full-width figure plates and a sticky section index. */
:root {
  --bg: #F6F7F3;          /* paper with a faint loess-green bias */
  --surface: #FFFFFF;
  --ink: #1E2A2E;
  --muted: #5B6A6E;
  --rule: #D5DCD6;
  --accent: #2F6B5F;      /* Funiu forest green */
  --accent-2: #8E2F3C;    /* nature-reserve red, as on Fig. 1 */
  --river: #1F6FA8;
  --amph: #2E8B78; --rept: #C08A2E; --aves: #3A6EA5; --mamm: #A0435A;
  --chip: #E7EDE8;
  --warn: #B26B16;
  --figbg: #FFFFFF;
  --serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141A1B; --surface: #1C2426; --ink: #E4EAE6; --muted: #9AA9A6; --rule: #2E3A3C;
  --accent: #6FB3A2; --accent-2: #D7838F; --river: #79B3E0; --chip: #243033; --warn: #E3A35A;
  --amph: #5FC0A8; --rept: #E0B262; --aves: #7FA9DA; --mamm: #D07C92; --figbg: #F4F5F2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141A1B; --surface: #1C2426; --ink: #E4EAE6; --muted: #9AA9A6; --rule: #2E3A3C;
  --accent: #6FB3A2; --accent-2: #D7838F; --river: #79B3E0; --chip: #243033; --warn: #E3A35A;
  --amph: #5FC0A8; --rept: #E0B262; --aves: #7FA9DA; --mamm: #D07C92; --figbg: #F4F5F2; color-scheme: dark }

* { box-sizing: border-box }
html { scroll-behavior: smooth; scroll-padding-top: calc(56px + env(safe-area-inset-top, 0px)) }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto } }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.read { max-width: 46em }
h1, h2, h3 { font-family: var(--serif); text-wrap: balance; line-height: 1.3; margin: 0 }
h1 { font-size: clamp(1.9rem, 4.6vw, 2.9rem); font-weight: 700; letter-spacing: 0.01em }
h2 { font-size: 1.55rem; font-weight: 700 }
h3 { font-size: 1.1rem; font-weight: 700 }
p { margin: 0 }
a { color: var(--accent) }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.en { display: block; font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: 0.62em; letter-spacing: 0.02em; margin-top: 4px }
.label { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }

/* sticky index */
nav.index { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule) }
nav.index .wrap { display: flex; gap: 4px 18px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; white-space: nowrap }
nav.index a { color: var(--muted); text-decoration: none; font-size: 0.86rem }
nav.index a:hover { color: var(--ink) }

header.top { padding-block: 56px 36px; border-bottom: 1px solid var(--rule) }
header.top .grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 36px; align-items: end }
header.top .lede { margin-top: 18px; color: var(--ink); max-width: 38em }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; color: var(--ink) }
.chip.warn { color: var(--warn) }

/* specimen label: the core count */
.tag { border: 1px solid var(--ink); background: var(--surface); padding: 18px 20px 16px; position: relative }
.tag::before { content: ""; position: absolute; left: 14px; top: -7px; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink); background: var(--bg) }
.tag .big { font-family: var(--serif); font-size: 3.4rem; line-height: 1; font-weight: 700 }
.tag .big small { font-size: 1rem; font-family: var(--sans); font-weight: 500; margin-left: 6px }
.tag dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 14px 0 0; font-size: 0.86rem }
.tag dt { color: var(--muted) }
.tag dd { margin: 0 }

section { padding-block: 52px; border-bottom: 1px solid var(--rule) }
section > .wrap > h2 { margin-bottom: 18px }
.stack { display: grid; gap: 14px }

/* class coverage rows */
.classes { display: grid; gap: 10px; margin-top: 26px }
.crow { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 5.5em; gap: 14px; align-items: center }
.crow .name { font-weight: 500 }
.crow .name i { font-style: normal; color: var(--muted); font-size: 0.82rem; display: block; line-height: 1.2 }
.bars { display: grid; gap: 4px }
.bar { height: 10px; background: var(--chip); position: relative; border-radius: 2px; overflow: hidden }
.bar span { position: absolute; inset: 0 auto 0 0; border-radius: 2px }
.bar.cty span { opacity: 0.55 }
.crow .val { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); text-align: right; line-height: 1.35 }
.legend-mini { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8rem; color: var(--muted); margin-top: 8px }
.legend-mini b { display: inline-block; width: 22px; height: 8px; background: var(--muted); margin-right: 6px; vertical-align: middle; border-radius: 2px }

/* figures */
.plates { display: grid; gap: 40px }
figure { margin: 0 }
figure .plate { background: var(--figbg); border: 1px solid var(--rule); padding: 10px; cursor: zoom-in; display: block; width: 100% }
figure img { display: block; width: 100%; height: auto }
figcaption { margin-top: 10px; font-size: 0.88rem; color: var(--ink); max-width: 52em }
figcaption .en { font-size: 0.82rem; margin-top: 4px; line-height: 1.6 }
figcaption b { font-family: var(--serif) }
.zoom { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 15, 0.86); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out }
.zoom img { max-width: 100%; max-height: 100%; background: #fff }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; min-width: 640px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top }
th { font-weight: 700; font-size: 0.8rem; color: var(--muted); background: var(--bg); position: sticky; top: 0 }
tbody tr:last-child td { border-bottom: 0 }
td.sci { font-style: italic; white-space: nowrap }
td.n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums }
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 0.76rem; background: var(--chip); white-space: nowrap }
.pill.p1 { color: var(--accent-2) } .pill.p2 { color: var(--warn) } .pill.p3 { color: var(--accent) }

/* partner grid */
.partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px }
.partner { border-top: 3px solid var(--accent); background: var(--surface); padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.partner:nth-child(2) { border-top-color: var(--accent-2) } .partner:nth-child(3) { border-top-color: var(--river) }
.partner:nth-child(4) { border-top-color: var(--rept) } .partner:nth-child(5) { border-top-color: var(--aves) } .partner:nth-child(6) { border-top-color: var(--muted) }
.partner ul { margin: 0; padding-left: 1.1em; font-size: 0.9rem }
.partner .give { font-size: 0.82rem; color: var(--muted) }

/* review lists */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px }
.tabs button, .filters select, .filters input { font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 6px 12px; border-radius: 4px }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
.filters input { min-width: 0; flex: 1 1 200px }
.count { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px }

/* timeline */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0; border-left: 1px solid var(--rule) }
.phase { padding: 4px 18px 8px; border-right: 1px solid var(--rule); display: grid; gap: 6px; align-content: start; min-width: 0 }
.phase .when { font-family: var(--mono); font-size: 0.78rem; color: var(--accent) }
.phase ul { margin: 0; padding-left: 1.1em; font-size: 0.88rem }

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px }
.note { border-left: 3px solid var(--warn); padding: 6px 0 6px 14px; font-size: 0.9rem; color: var(--ink); background: transparent }
footer { padding-block: 36px 56px; color: var(--muted); font-size: 0.84rem }

@media (max-width: 760px) {
  header.top .grid, .two { grid-template-columns: minmax(0, 1fr) }
  .crow { grid-template-columns: 6.8em minmax(0, 1fr) 4.6em; gap: 10px }
  header.top { padding-block: 36px 28px }
  section { padding-block: 40px }
}

/* registration form */
.reg { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start }
form.card { background: var(--surface); border: 1px solid var(--rule); padding: 20px; display: grid; gap: 14px; min-width: 0 }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0 }
legend { font-family: var(--serif); font-weight: 700; font-size: 1rem; margin-bottom: 4px; padding: 0 }
.f2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.field { display: grid; gap: 4px; min-width: 0 }
.field > span { font-size: 0.82rem; color: var(--muted) }
.field > span em { color: var(--accent-2); font-style: normal }
.field input, .field select, .field textarea { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 10px; width: 100%; min-width: 0 }
.field textarea { min-height: 72px; resize: vertical }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.9rem }
.checks label { display: inline-flex; gap: 6px; align-items: center }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn { font: inherit; font-size: 0.9rem; border-radius: 4px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--bg) }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule) }
.btn:disabled { opacity: 0.5; cursor: not-allowed }
.status { font-size: 0.86rem; color: var(--muted) }
.status.err { color: var(--accent-2) }
.status.ok { color: var(--accent) }
.roster { display: grid; gap: 10px; min-width: 0 }
.entry { background: var(--surface); border: 1px solid var(--rule); padding: 12px 14px; display: grid; gap: 4px; font-size: 0.88rem; min-width: 0 }
.entry .who { font-weight: 700 }
.entry .what { color: var(--muted); overflow-wrap: anywhere }
.entry .tags { display: flex; flex-wrap: wrap; gap: 4px }
.entry button { justify-self: start; font: inherit; font-size: 0.8rem; background: none; border: 0; color: var(--accent-2); padding: 0; cursor: pointer }
.empty { border: 1px dashed var(--rule); padding: 18px; font-size: 0.88rem; color: var(--muted) }
@media (max-width: 760px) { .reg, .f2 { grid-template-columns: minmax(0, 1fr) } }

/* background / method / basis */
.cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 22px; margin-top: 22px }
.cols3 > div { display: grid; gap: 8px; align-content: start; min-width: 0 }
.cols3 h3 { font-size: 1rem }
.cols3 p, .cols3 li { font-size: 0.92rem }
.cols3 ul { margin: 0; padding-left: 1.1em }
ol.steps { list-style: none; counter-reset: st; margin: 22px 0 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule) }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 14px; padding-block: 14px; border-bottom: 1px solid var(--rule) }
ol.steps li::before { content: counter(st, decimal-leading-zero); font-family: var(--mono); color: var(--accent); font-size: 1.05rem; padding-top: 2px }
ol.steps h3 { font-size: 1rem; margin-bottom: 2px }
ol.steps p { font-size: 0.9rem; color: var(--ink) }
.assets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-top: 14px }
.asset { background: var(--surface); border: 1px solid var(--rule); padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.asset .figs { font-family: var(--mono); font-size: 0.82rem; color: var(--accent); font-variant-numeric: tabular-nums }
.asset p { font-size: 0.88rem }
.asset .st { font-size: 0.78rem; color: var(--muted) }
.funds { display: grid; gap: 8px; margin-top: 10px }
.fund { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--rule); font-size: 0.9rem }
.fund .no { font-family: var(--mono); font-size: 0.84rem; color: var(--muted); white-space: nowrap }
.invite { background: var(--surface); border-left: 3px solid var(--accent); padding: 18px 20px; display: grid; gap: 10px; max-width: 52em }
.invite p { font-size: 0.96rem }
@media (max-width: 760px) { .fund { grid-template-columns: minmax(0, 1fr) } }

/* contact footer */
footer.site { border-top: 1px solid var(--rule); background: var(--surface); padding-block: 40px 56px }
.contact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: start }
.contact .who { display: grid; gap: 6px }
.contact .who .name { font-family: var(--serif); font-size: 1.25rem; font-weight: 700 }
.contact .who p { font-size: 0.9rem; color: var(--muted) }
.lines { display: grid; gap: 0; border-top: 1px solid var(--rule) }
.line { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--rule) }
.line .k { font-size: 0.82rem; color: var(--muted) }
.line .v { font-family: var(--mono); font-size: 1rem; user-select: all; overflow-wrap: anywhere; font-variant-numeric: tabular-nums }
.copy { font: inherit; font-size: 0.8rem; background: transparent; color: var(--accent); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; cursor: pointer; min-width: 4.5em }
.fine { margin-top: 26px; font-size: 0.82rem; color: var(--muted); display: grid; gap: 4px }
@media (max-width: 760px) { .contact { grid-template-columns: minmax(0, 1fr) } .line { grid-template-columns: minmax(0, 1fr) auto } .line .k { grid-column: 1 / -1 } }

.reg-go { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--rule); padding: 20px }
.reg-go .btn { justify-self: start; text-decoration: none }
.qr { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 0.8rem; color: var(--muted) }
.qr svg { width: 148px; height: 148px; background: #fff; padding: 6px }
.dl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 16px }
.dl .btn { text-decoration: none }
a.v { color: var(--ink); text-decoration: none }
@media (max-width: 760px) { .reg-go { grid-template-columns: minmax(0, 1fr) } .qr { justify-items: start } }

ol.hist { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 0; position: relative }
ol.hist::before { content: ""; position: absolute; left: 7.4em; top: 8px; bottom: 8px; width: 2px; background: var(--rule) }
li.stg { display: grid; grid-template-columns: 6.4em minmax(0, 1fr); gap: 0 2.4em; padding-block: 12px 16px; position: relative }
li.stg::before { content: ""; position: absolute; left: calc(7.4em - 5px); top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent) }
li.stg:last-child::before { background: var(--accent) }
li.stg .when { font-family: var(--mono); font-size: 0.82rem; color: var(--accent); padding-top: 4px; text-align: right; font-variant-numeric: tabular-nums }
li.stg h3 { font-size: 1.05rem } li.stg h3 .en { font-size: 0.72rem; display: inline; margin-left: 8px }
li.stg ul { margin: 6px 0 0; padding-left: 1.1em; font-size: 0.9rem; display: grid; gap: 3px }
li.stg .who { margin-top: 6px; font-size: 0.8rem; color: var(--muted) }
h3.sub { margin: 34px 0 12px; font-size: 1.1rem } h3.sub .en { display: inline; margin-left: 8px; font-size: 0.72rem }
table.totals td.n { text-align: right } table.totals th:nth-child(n+4) { text-align: right }
table.totals tr.me td { background: color-mix(in srgb, var(--accent) 9%, transparent); font-weight: 600 }
.gapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px }
.gapgrid > div { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--warn); border-radius: var(--radius, 8px); padding: 12px 14px; display: grid; gap: 4px; align-content: start }
.gapgrid h3 { font-size: 0.98rem } .gapgrid p { font-size: 0.88rem; color: var(--muted) }
@media (max-width: 760px) {
  ol.hist::before { left: 5px }
  li.stg { grid-template-columns: minmax(0, 1fr); padding-left: 24px }
  li.stg::before { left: 0 }
  li.stg .when { text-align: left; padding-top: 0 }
}

.adm { padding-block: 24px 48px; display: grid; gap: 16px }
.login { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.login input { font: inherit; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); min-width: 0; flex: 1 1 240px }
.item { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--warn); padding: 12px 14px; display: grid; gap: 6px; font-size: 0.88rem }
.item.accepted { border-left-color: var(--accent) } .item.rejected { border-left-color: var(--muted); opacity: .8 }
.item .hd { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.8rem }
.item dl { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 3px 12px; margin: 0 }
.item dt { color: var(--muted) } .item dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap }
.item .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.item .row input { font: inherit; font-size: 0.86rem; flex: 1 1 220px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--ink); min-width: 0 }

/* ---------- design layer (site_chrome.py) ---------- */
:root { --on-accent: #FFFFFF; --radius: 8px; --shadow: 0 1px 2px rgba(20, 30, 32, .05), 0 4px 14px rgba(20, 30, 32, .05) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --on-accent: #0E1A17; --shadow: none } }
:root[data-theme="dark"] { --on-accent: #0E1A17; --shadow: none }
html { scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)) }
html:has(.subnav) { scroll-padding-top: calc(118px + env(safe-area-inset-top, 0px)) }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility }
::selection { background: color-mix(in srgb, var(--accent) 22%, transparent) }

/* header */
.sitebar { position: sticky; top: 0; z-index: 8; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.3) blur(8px); -webkit-backdrop-filter: saturate(1.3) blur(8px); border-bottom: 1px solid var(--rule) }
.sitebar > .wrap { display: flex; align-items: center; gap: 8px 24px; min-height: 60px }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0 }
.brand svg { flex: none }
.brand b { display: block; font-family: var(--serif); font-size: 1.02rem; line-height: 1.25; white-space: nowrap }
.brand small { display: block; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; line-height: 1.2 }
.mainnav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none }
.mainnav::-webkit-scrollbar, .subnav .wrap::-webkit-scrollbar { display: none }
.mainnav a { padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 0.9rem; white-space: nowrap }
.mainnav a:hover { color: var(--ink); background: var(--chip) }
.mainnav a[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); font-weight: 600 }
.subnav { border-top: 1px solid var(--rule) }
.subnav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-height: 42px; align-items: center }
.subnav a { font-size: 0.82rem; color: var(--muted); text-decoration: none; padding: 3px 11px; border-radius: 999px; white-space: nowrap }
.subnav a:hover { color: var(--ink) }
.subnav a.on { color: var(--ink); background: var(--chip); font-weight: 600 }
body::before { display: none }
@media (max-width: 760px) {
  .sitebar > .wrap { flex-wrap: wrap; gap: 0; padding-top: 8px }
  .brand small { display: none }
  .mainnav { margin: 0 -6px; width: calc(100% + 12px); padding-block: 4px 6px }
  .mainnav a { padding: 5px 9px; font-size: 0.86rem }
  html { scroll-padding-top: calc(108px + env(safe-area-inset-top, 0px)) }
  html:has(.subnav) { scroll-padding-top: calc(150px + env(safe-area-inset-top, 0px)) }
}

/* hero */
header.top { background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 55%), var(--bg) }
h1 .nb { display: inline-block }
.lede { font-size: 1.02rem }

/* surfaces, buttons, tables */
.btn { border-radius: 6px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; transition: filter .15s, background .15s; text-decoration: none; display: inline-block }
.btn:hover { filter: brightness(1.07) }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--rule) }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none }
.tbl, .asset, .partner, .fund, .reg-go, .card2, .mapbox, form.card, .invite { border-radius: var(--radius) }
.tbl { box-shadow: var(--shadow) }
.partner, .asset { box-shadow: var(--shadow) }
th { background: color-mix(in srgb, var(--chip) 60%, var(--surface)) }
section > .wrap > h2 { margin-bottom: 14px }
section > .wrap > h2 + .read, section > .wrap > h2 + p { color: var(--ink) }
.chip { border: 1px solid transparent }
.chip.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent) }
.pill { border: 1px solid color-mix(in srgb, currentColor 18%, transparent) }

/* three ways to take part (home) */
.join { background: var(--surface) }
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; margin-top: 18px }
.way { display: grid; gap: 8px; align-content: start; padding: 20px 20px 18px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--bg); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s }
.way:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow) }
.way .no { font-family: var(--mono); font-size: 0.78rem; color: var(--accent); letter-spacing: 0.08em }
.way h3 { font-size: 1.12rem }
.way p { font-size: 0.9rem; color: var(--muted) }
.way .go { margin-top: 4px; font-size: 0.9rem; font-weight: 600; color: var(--accent) }
.alt { margin-top: 16px; font-size: 0.86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px }

/* how-to strip (checklist, atlas) */
ol.howto { list-style: none; counter-reset: hw; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px }
ol.howto li { counter-increment: hw; display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 2px 8px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); font-size: 0.86rem; align-content: start }
ol.howto li::before { content: counter(hw); grid-row: span 2; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-family: var(--mono); font-size: 0.82rem }
ol.howto b { font-size: 0.92rem }
ol.howto span { color: var(--muted) }

@media (max-width: 760px) {
  ol.howto { gap: 6px } ol.howto li { padding: 8px 12px }
  .filters select { flex: 1 1 calc(50% - 8px); max-width: 100% }
}
.filters select { max-width: 100%; min-width: 0 }

/* footer */
footer.site { padding-block: 44px 48px }
.fgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.8fr) minmax(0, 1fr); gap: 32px; align-items: start }
.fgrid .who { display: grid; gap: 6px }
.fgrid .who .name { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; color: var(--ink) }
.fgrid .who p { font-size: 0.9rem; color: var(--muted) }
.fgrid .lines { margin-top: 8px }
.fgrid .label { margin-bottom: 10px }
.flinks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem }
.flinks a { color: var(--ink); text-decoration: none } .flinks a:hover { color: var(--accent) }
dl.fver { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 0.86rem }
dl.fver dt { color: var(--muted) } dl.fver dd { margin: 0; color: var(--ink) }
.cp { font: inherit; font-size: 0.8rem; background: transparent; color: var(--accent); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; cursor: pointer; min-width: 4.5em }
.fine { border-top: 1px solid var(--rule); padding-top: 18px; margin-top: 28px }
.fine b { color: var(--ink); font-weight: 600 }
@media (max-width: 860px) { .fgrid { grid-template-columns: minmax(0, 1fr) } }

/* print: a clean review copy */
@media print {
  .sitebar, .subnav, footer.site script, .filters, .toolbar, .more, .acts, .tabs, .zoom, .btn, .cp, .copy { display: none !important }
  body { background: #fff; color: #000; font-size: 11pt }
  section { padding-block: 14px; break-inside: auto }
  .tbl { box-shadow: none; overflow: visible; border: 0 }
  table { min-width: 0 !important; font-size: 9pt }
  th { position: static }
  header.top { background: none; padding-block: 0 12px }
  a { color: inherit; text-decoration: none }
}
</style>
</head>
